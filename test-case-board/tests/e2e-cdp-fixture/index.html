<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue 54 recorder and CDP fixture</title>
<main>
  <h1>Recorder and CDP fixture</h1>
  <p>This page contains no account or customer data.</p>
  <button id="probe" type="button">Send native click</button>
  <p id="outcome" aria-live="polite">Waiting for a trusted click.</p>
</main>
<script>
  document.querySelector('#probe').addEventListener('click', (event) => {
    document.querySelector('#outcome').textContent = event.isTrusted
      ? 'Trusted click received.' : 'Untrusted click rejected.';
  });
</script>
</html>
